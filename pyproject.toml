[project]
name = "twin-cities-real-estate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "saroshkhann", email = "ksarosh785@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "geopy>=2.5.0",
    "lxml>=6.1.3",
    "matplotlib>=3.10.9",
    "pandas>=2.3.3",
    "plotly>=7.1.0",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
    "streamlit>=1.64.0",
]

[project.scripts]
twin-cities-real-estate = "twin_cities_real_estate:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
